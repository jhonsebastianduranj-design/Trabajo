apiVersion: apps/v1
kind: Deployment
metadata:
  name: aca-app
  labels:
    app: aca-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aca-app
  template:
    metadata:
      labels:
        app: aca-app
    spec:
      containers:
        - name: aca-app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aca-app-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: aca-app
